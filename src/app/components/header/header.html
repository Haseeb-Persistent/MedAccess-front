<!-- header.component.html -->
<nav class="navbar" id="ftco-navbar">
  <div class="container">
    <!-- Checkbox for toggling menu -->
    <input type="checkbox" id="check" [checked]="isMobileMenuOpen" (change)="toggleMobileMenu()">
    
    <!-- Menu icon -->
    <label for="check" class="checkbtn">
      <i class="fas fa-bars"></i>
    </label>
    
    <!-- Site logo -->
    <a class="logo" routerLink="/" (click)="closeMobileMenu()">
      <img src="/assets/img/main-logo.png" alt="Rently" >
    </a>
    
    <!-- Navigation links -->
    <ul>
      <li [class.active]="isActive('/')">
        <a routerLink="/" (click)="closeMobileMenu()">Home</a>
      </li>
      <li [class.active]="isActive('/About-Us')">
        <a routerLink="/About-Us" (click)="closeMobileMenu()">About</a>
      </li>
      <li [class.active]="isActive('/CarSection')">
        <a routerLink="/CarSection" (click)="closeMobileMenu()">Vehicles</a>
      </li>
      <li [class.active]="isActive('/Blog')">
        <a routerLink="/Blog" (click)="closeMobileMenu()">Blog</a>
      </li>
      <li [class.active]="isActive('/Contact-Us')">
        <a routerLink="/Contact-Us" (click)="closeMobileMenu()">Contact</a>
      </li>
      <!-- Auth buttons in mobile menu -->
      <li class="mobile-auth-links">
        <a routerLink="/login" class="btn btn-outline-primary" (click)="closeMobileMenu()">Login</a>
        <a routerLink="/signup" class="btn btn-primary" (click)="closeMobileMenu()">Sign Up</a>
      </li>
    </ul>
    
    <!-- Auth Buttons - Desktop -->
    <div class="auth-buttons">
      <a routerLink="/login" class="btn btn-outline-primary btn-sm">Login</a>
      <a routerLink="/signup" class="btn btn-primary btn-sm">Sign Up</a>
    </div>
  </div>
</nav>
