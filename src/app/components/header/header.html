<!-- header.component.html -->
<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar" id="ftco-navbar">
  <div class="container">
    <!-- Brand / Logo -->
    <a class="navbar-brand" routerLink="/">
      <img src="/assets/img/main-logo.png" alt="" style="width: 60px;height: 50px;">
    </a>

    <!-- Toggler (mobile) -->
    <button class="navbar-toggler" type="button" (click)="toggleMobileMenu()"
            [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle navigation">
      <span class="oi oi-menu"></span> Menu
    </button>

    <!-- Navbar links -->
    <div class="collapse navbar-collapse" [class.show]="isMobileMenuOpen" id="ftco-nav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item" [class.active]="isActive('/')">
          <a class="nav-link" routerLink="/" (click)="closeMobileMenu()">Home</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/about')">
          <a class="nav-link" routerLink="/about" (click)="closeMobileMenu()">About</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/services')">
          <a class="nav-link" routerLink="/services" (click)="closeMobileMenu()">Services</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/pricing')">
          <a class="nav-link" routerLink="/pricing" (click)="closeMobileMenu()">Pricing</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/cars')">
          <a class="nav-link" routerLink="/CarSection" (click)="closeMobileMenu()">Cars</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/Blog')">
          <a class="nav-link" routerLink="/Blog" (click)="closeMobileMenu()">Blog</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/Contact-Us')">
          <a class="nav-link" routerLink="/Contact-Us" (click)="closeMobileMenu()">Contact</a>
        </li>
      </ul>
      
      <!-- Auth Links -->
      <div class="auth-links">
        <ng-container *ngIf="!(auth.isAuthenticated$ | async)">
          <a class="auth-btn auth-login" routerLink="/login" (click)="closeMobileMenu()">
            <i class="fas fa-sign-in-alt"></i> Login
          </a>
          <a class="auth-btn auth-register" routerLink="/register" (click)="closeMobileMenu()">
            <i class="fas fa-user-plus"></i> Register
          </a>
        </ng-container>
        <ng-container *ngIf="(auth.isAuthenticated$ | async)">
          <div class="user-dropdown">
            <div class="user-info" >
              <span class="user-avatar">
                {{ (auth.currentUser$ | async)?.firstName?.charAt(0) }}{{ (auth.currentUser$ | async)?.lastName?.charAt(0) }}
              </span>
              <span class="user-name">{{ (auth.currentUser$ | async)?.firstName }}</span>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu" >
              <a routerLink="/profile" (click)="closeMobileMenu()">
                <i class="fas fa-user"></i> Profile
              </a>
              <a routerLink="/my-bookings" (click)="closeMobileMenu()">
                <i class="fas fa-calendar-alt"></i> My Bookings
              </a>
              <a routerLink="/change-password" (click)="closeMobileMenu()">
                <i class="fas fa-key"></i> Change Password
              </a>
              <hr>
              <button class="logout-btn" (click)="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
              </button>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
