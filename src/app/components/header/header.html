<nav id="ftco-navbar" >

  <!-- Logo -->
  <a
    routerLink="/RENT-A-CAR"
    class="logo"
    (click)="closeMobileMenu()"
    aria-label="Rent A Car Home">

    <img
      src="/assets/img/main-logo.png"
      alt="Rent A Car"
    />

  </a>


  <!-- Mobile Menu Button -->
  <button
    type="button"
    class="checkbtn"
    (click)="toggleMobileMenu()"
    [attr.aria-expanded]="isMobileMenuOpen"
    aria-label="Toggle navigation menu">

    <i
      class="fas"
      [class.fa-bars]="!isMobileMenuOpen"
      [class.fa-times]="isMobileMenuOpen">
    </i>

  </button>


  <!-- Navigation Menu -->
  <ul
    class="nav-menu"
    [class.mobile-open]="isMobileMenuOpen">

    <!-- Home -->
    <li>
      <a
        routerLink="/RENT-A-CAR"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMobileMenu()">

        Home

      </a>
    </li>


    <!-- Cars -->
    <li>
      <a
        routerLink="/CarSection"
        routerLinkActive="active"
        (click)="closeMobileMenu()">

        Cars

      </a>
    </li>


    <!-- Appointment -->
    <li>
      <a
        routerLink="/Appointment"
        routerLinkActive="active"
        (click)="closeMobileMenu()">

        Appointment

      </a>
    </li>


    <!-- Blog -->
    <li>
      <a
        routerLink="/Blog"
        routerLinkActive="active"
        (click)="closeMobileMenu()">

        Blog

      </a>
    </li>


    <!-- About Us -->
    <li>
      <a
        routerLink="/About-Us"
        routerLinkActive="active"
        (click)="closeMobileMenu()">

        About Us

      </a>
    </li>


    <!-- Contact Us -->
    <li>
      <a
        routerLink="/Contact-Us"
        routerLinkActive="active"
        (click)="closeMobileMenu()">

        Contact Us

      </a>
    </li>

  </ul>

</nav>
