    </a>

    <!-- Toggler (mobile) -->
    <button class="navbar-toggler" type="button" (click)="toggleMobileMenu()"

      <span class="oi oi-menu"></span> Menu
    </button>

    <!-- Navbar links -->
    <div class="collapse navbar-collapse" [class.show]="isMobileMenuOpen" id="ftco-nav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item" [class.active]="isActive('/')">
          <a class="nav-link" routerLink="/" (click)="closeMobileMenu()">Home</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/about')">
          <a class="nav-link" routerLink="/about" (click)="closeMobileMenu()">About</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/services')">
          <a class="nav-link" routerLink="/services" (click)="closeMobileMenu()">Services</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/pricing')">
          <a class="nav-link" routerLink="/pricing" (click)="closeMobileMenu()">Pricing</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/cars')">
          <a class="nav-link" routerLink="/CarSection" (click)="closeMobileMenu()">Cars</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/Blog')">
          <a class="nav-link" routerLink="/Blog" (click)="closeMobileMenu()">Blog</a>
        </li>
        <li class="nav-item" [class.active]="isActive('/Contact-Us')">
          <a class="nav-link" routerLink="/Contact-Us" (click)="closeMobileMenu()">Contact</a>
        </li>
      </ul>
    </div>
  </div>
