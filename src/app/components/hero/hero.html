<!-- ====== HERO SECTION WITH CUSTOM CAROUSEL ====== -->
<section class="hero-section" 
         (mouseenter)="pauseAutoplay()" 
         (mouseleave)="resumeAutoplay()">
  
  <div class="carousel-container">
    <!-- Carousel Track -->
    <div class="carousel-track" 
         [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
      
      <div class="carousel-slide" 
           *ngFor="let slide of slides; let i = index"
           [style.background-image]="'url(' + slide.image + ')'"
           [style.background-size]="'cover'"
           [style.background-position]="'center'">
        
        <!-- Multiple Overlay Layers for Shadow Effect -->
        <div class="slide-overlay overlay-dark"></div>
        <div class="slide-overlay overlay-gradient"></div>
        <div class="slide-overlay overlay-shadow"></div>
        
        <div class="slide-content">
          <div class="container">
            <div class="hero-text">
              <h1 [innerHTML]="slide.title"></h1>
              <p>{{ slide.description }}</p>
              <div class="hero-buttons">
                <a href="#" class="btn btn-primary btn-hero">Know More</a>
                <a href="#" class="btn btn-outline-light btn-hero">Get Started</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Carousel Controls -->
    <button class="carousel-control carousel-control-prev" (click)="prevSlide()">
      <span class="control-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </span>
    </button>
    <button class="carousel-control carousel-control-next" (click)="nextSlide()">
      <span class="control-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </span>
    </button>

    <!-- Carousel Indicators -->
    <div class="carousel-indicators">
      <button *ngFor="let slide of slides; let i = index"
              class="indicator"
              [class.active]="i === currentSlide"
              (click)="goToSlide(i)"
              [attr.aria-label]="'Slide ' + (i + 1)">
      </button>
    </div>
  </div>
</section>
