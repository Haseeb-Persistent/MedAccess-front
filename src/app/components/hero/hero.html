<!-- hero.component.html -->
<section class="hero-section">
  <div class="hero-background">
    <img src="/assets/img/about-us-img.png" alt="Rently Car Rental">
    <div class="hero-overlay"></div>
  </div>
  
  <div class="hero-content">
    <div class="container">
      <div class="hero-text">
        <h1>Fast & Easy Way <br>To <span class="highlight">Rent A Car</span></h1>
        <p>A small river named Dudan flows by their place and supplies it with the necessary regelialia. It is a paradisematic country, in which roasted parts of sentences fly into your mouth.</p>
        
        <!-- Search Form -->
        <div class="hero-search-wrapper">
          <form class="hero-search-form" (ngSubmit)="onSearch()">
            <div class="search-row">
              <!-- Pickup Location -->
              <div class="search-field">
                <div class="field-icon">
                  <i class="fas fa-map-marker-alt"></i>
                </div>
                <input type="text" 
                       placeholder="Where to pick up?"
                       [(ngModel)]="searchData.pickupLocation"
                       name="pickupLocation"
                       class="search-input"
                       required>
              </div>

              <!-- Pickup Date -->
              <div class="search-field">
                <div class="field-icon">
                  <i class="fas fa-calendar-alt"></i>
                </div>
                <input type="date" 
                       [(ngModel)]="searchData.pickupDate"
                       name="pickupDate"
                       class="search-input"
                       required>
              </div>

              <!-- Pickup Time -->
              <div class="search-field">
                <div class="field-icon">
                  <i class="fas fa-clock"></i>
                </div>
                <input type="time" 
                       [(ngModel)]="searchData.pickupTime"
                       name="pickupTime"
                       class="search-input"
                       required>
              </div>

              <!-- Drop-off Date -->
              <div class="search-field">
                <div class="field-icon">
                  <i class="fas fa-calendar-check"></i>
                </div>
                <input type="date" 
                       [(ngModel)]="searchData.dropoffDate"
                       name="dropoffDate"
                       class="search-input"
                       required>
              </div>

              <!-- Search Button -->
              <button type="submit" class="btn-search-hero">
                <i class="fas fa-search"></i>
                Search
              </button>
            </div>

            <!-- Same Location Toggle -->
            <div class="search-options">
              <label class="checkbox-label">
                <input type="checkbox" 
                       [(ngModel)]="searchData.sameLocation"
                       name="sameLocation">
                <span class="checkmark"></span>
                <i class="fas fa-check-circle"></i>
                Drop-off at same location
              </label>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
