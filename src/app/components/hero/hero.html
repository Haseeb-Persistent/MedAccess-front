<!-- ====== HERO SECTION WITH CUSTOM CAROUSEL ====== -->
<section class="hero-section" 
         (mouseenter)="pauseAutoplay()" 
         (mouseleave)="resumeAutoplay()">
    
    <!-- Carousel Inner -->
    <div class="carousel-inner">
        <div class="carousel-item" 
             *ngFor="let slide of slides; let i = index" 
             [class.active]="i === currentSlide">
            
            <!-- Condition: If VideoFrame exists, show video, else show background image -->
            <div class="hero-slide" 
                 [style.background-image]="!slide.VideoFrame ? 'url(' + slide.image + ')' : 'none'"
                 [style.background-color]="slide.bgColor">
                
                <!-- Video element (Only renders if VideoFrame exists) -->
                <video *ngIf="slide.VideoFrame" 
                       src="{{ slide.VideoFrame }}" 
                       autoplay muted loop playsinline 
                       class="background-video">
                </video>

                <!-- Overlay for text readability over Video and Image -->
                <div class="hero-overlay">
                    <div class="container">
                        <div class="hero-content">
                            <h1 [innerHTML]="slide.title"></h1>
                            <p>{{ slide.description }}</p>
                            <div class="hero-buttons">
                                <a href="#" class="btn-primary">Know More</a>
                                <a href="#" class="btn-secondary">Get Started</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Carousel Controls - Only Buttons -->
    <button class="carousel-control-prev" (click)="prevSlide()">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" (click)="nextSlide()">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>

    <!-- Carousel Indicators -->
    <div class="carousel-indicators">
        <button type="button" 
                *ngFor="let slide of slides; let i = index"
                [class.active]="i === currentSlide"
                [attr.aria-label]="'Slide ' + (i + 1)"
                (click)="goToSlide(i)">
        </button>
    </div>
</section>
