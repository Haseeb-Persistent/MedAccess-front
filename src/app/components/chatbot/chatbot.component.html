<div class="chatbot-container" [class.open]="isOpen" [class.minimized]="isMinimized" 
     [class.bottom-right]="position === 'bottom-right'" 
     [class.bottom-left]="position === 'bottom-left'">
    
    <!-- Chat Button (when closed) -->
    <button class="chat-toggle" *ngIf="!isOpen" (click)="toggleChat()" aria-label="Open Chat">
        <i class="fas fa-comment-dots"></i>
        <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </button>

    <!-- Chat Window -->
    <div class="chat-window" *ngIf="isOpen">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left" (click)="toggleMinimize()">
                <div class="bot-avatar">
                    <img *ngIf="botAvatar" [src]="botAvatar" alt="Bot Avatar">
                    <span *ngIf="!botAvatar" class="avatar-text">{{ getInitials(botName) }}</span>
                    <span class="online-status"></span>
                </div>
                <div class="header-info">
                    <span class="bot-name">{{ botName }}</span>
                    <span class="bot-status">Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="minimize-btn" (click)="toggleMinimize()" aria-label="Minimize">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="close-btn" (click)="toggleChat()" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" #chatMessages>
            <div *ngFor="let message of messages" 
                 class="message-wrapper" 
                 [class.bot]="message.sender === 'bot'" 
                 [class.user]="message.sender === 'user'">
                
                <!-- Avatar -->
                <div class="message-avatar" *ngIf="message.sender === 'bot'">
                    <img *ngIf="botAvatar" [src]="botAvatar" alt="Bot">
                    <span *ngIf="!botAvatar" class="avatar-text">{{ getInitials(botName) }}</span>
                </div>
                <div class="message-avatar user-avatar" *ngIf="message.sender === 'user'">
                    <img *ngIf="userAvatar" [src]="userAvatar" alt="User">
                    <span *ngIf="!userAvatar" class="avatar-text">U</span>
                </div>

                <!-- Message Content -->
                <div class="message-content">
                    <div class="message-bubble" [class.bot]="message.sender === 'bot'" [class.user]="message.sender === 'user'">
                        <div class="message-text" [innerHTML]="message.text"></div>
                        <span class="message-time">{{ formatTime(message.timestamp) }}</span>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" *ngIf="isTyping">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="typing-text">{{ botName }} is typing...</span>
            </div>
        </div>

        <!-- Quick Replies -->
        <div class="quick-replies" *ngIf="!isTyping && messages.length < 5">
            <button *ngFor="let reply of quickReplies" 
                    class="quick-reply-btn" 
                    (click)="sendQuickReply(reply)">
                {{ reply }}
            </button>
        </div>

        <!-- Input Area -->
        <div class="chat-input">
            <textarea 
                [(ngModel)]="newMessage" 
                (keydown)="handleKeyPress($event)"
                placeholder="Type your message..."
                rows="1"
                class="input-field"
                #messageInput
                [disabled]="isTyping">
            </textarea>
            <button class="send-btn" (click)="sendMessage()" [disabled]="!newMessage.trim() || isTyping">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
